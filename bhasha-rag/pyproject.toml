[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bhasharag"
version = "0.1.0"
description = "Multilingual RAG for Indian languages with calibrated refusal and an evaluation suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "regex>=2024.9",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
ml = [
    "torch>=2.6",
    "sentence-transformers>=5.0",
    "transformers>=4.56",
    "accelerate>=1.0",
    "datasets>=3.0",
    "faiss-cpu>=1.9",
]
local-llm = ["bitsandbytes>=0.46"]
ui = ["gradio>=5.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
