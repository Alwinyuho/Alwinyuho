name: queryguard CI

on:
  push:
    paths: ["queryguard/**", ".github/workflows/queryguard.yml"]
  pull_request:
    paths: ["queryguard/**", ".github/workflows/queryguard.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: queryguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: queryguard/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (guard, sandbox, agent loop, API)
        run: pytest -q
