name: shelfrank CI

on:
  push:
    paths: ["shelfrank/**", ".github/workflows/shelfrank.yml"]
  pull_request:
    paths: ["shelfrank/**", ".github/workflows/shelfrank.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shelfrank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shelfrank/pyproject.toml
      - name: Install (CPU-only PyTorch keeps CI fast)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
